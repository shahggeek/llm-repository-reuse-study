[project]
name = "llm-evolution-quality-study"
version = "0.1.0"
description = "Reproducibility tooling for a study of repository reuse in LLM-generated code"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
evaluation = [
  "docker==7.1.0",
]
structural = [
  "lizard==1.17.31",
  "tree-sitter==0.25.2",
  "tree-sitter-java==0.23.5",
]
private-review-import = [
  "numbers-parser==4.19.0",
]

[tool.study]
python-tested = ["3.9", "3.12", "3.13"]
core-verification = "make check"
full-evidence-verification = "make evidence-check"
